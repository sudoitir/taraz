name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # No pom.xml yet (workspace prepared, code comes via OpenSpec proposals) —
    # skip until the project is scaffolded instead of running red.
    if: hashFiles('pom.xml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
