# Development infrastructure (ADR-0025): PostgreSQL (system of record), Valkey (cache + idempotency), Kafka (outbox events).
# Versions are pinned via .env (see .env.example); defaults here are last-known-good.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taraz}
      POSTGRES_USER: ${POSTGRES_USER:-taraz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taraz}
    # Dev observability (see ops/postgres/): statement statistics + logged plans for slow statements.
    # 50ms is far above this app's profile (PK lookups, short row-lock writes) — anything logged is a finding.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=all
      - -c
      - auto_explain.log_min_duration=50ms
      - -c
      - auto_explain.log_analyze=false
      - -c
      - auto_explain.log_timing=false
      - -c
      - auto_explain.log_nested_statements=false
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-taraz} -d $${POSTGRES_DB:-taraz}"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9}
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-taraz}"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-taraz}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  postgres-data:
  valkey-data:
  kafka-data:
